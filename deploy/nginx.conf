# nginx site for the viewer (static files only). Build: cd viewer && VITE_SITE_URL=https://seedmap.example/ \
#   VITE_ISSUES_URL=https://github.com/OWNER/REPO/issues npm run build && node ../deploy/precompress.mjs
# Copy viewer/dist to /srv/gtnh-seedmap. gzip_static is built in; brotli_static needs ngx_brotli (drop the line
# without it). Headers mirror deploy/headers.json (the source of truth; deploy/serve.mjs uses it for tests).
server {
    listen 443 ssl http2;
    server_name seedmap.example;
    # ssl_certificate / ssl_certificate_key …

    root /srv/gtnh-seedmap;
    index index.html;

    types { application/wasm wasm; }
    gzip_static on;
    brotli_static on;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # content-hashed build output: cache forever (add_header in a location replaces the server-level ones → repeat)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
