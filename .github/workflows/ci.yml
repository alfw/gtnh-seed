# Lint, tests and a viewer build on every push / pull request.
name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --features json --all-targets -- -D warnings
      - name: Tests (native; tests needing the real-world dumps in testdata/pack skip)
        run: cargo test --release --features json
      - name: Tests (wasm crate)
        run: cargo test --release -p rwg2-wasm
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build
        working-directory: viewer
        run: npm ci && npm run build
