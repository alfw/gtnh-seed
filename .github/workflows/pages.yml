# Builds the wasm + Svelte viewer and publishes it to GitHub Pages.
# The public build: no developer tools; footer links to the exact commit's source and to this repo's issue form.
#
# Off until Pages is set up, so pushes don't fail on a repo without Pages:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#      (on a free plan the repo must be public for this)
#   2. Settings → Secrets and variables → Actions → Variables → New repository variable: PAGES_ENABLED = true
# Until then the jobs show as skipped. "Run workflow" (workflow_dispatch) also needs the variable.
name: pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: Test (native; tests needing the real-world dumps in testdata/pack skip)
        run: cargo test --release --features json
      - name: Build viewer
        working-directory: viewer
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          VITE_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
